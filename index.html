<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LootUP — казино платформа</title>
<meta name="theme-color" content="#0b0b1e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐮</text></svg>">
</head>
<body>
<div class="bgfx" aria-hidden="true">
  <div class="aurora a1"></div>
  <div class="aurora a2"></div>
  <div class="aurora a3"></div>
  <div class="grain"></div>
</div>

<div id="app">
  <aside id="side">
    <button class="logo" data-nav="home"><span class="logo-cow">🐮</span><span class="logo-text">Loot<b>UP</b><i class="logo-arrow">↗</i></span></button>
    <nav id="sidenav" class="sidenav"></nav>
    <div class="side-jackpot">
      <div class="sj-label">🏆 Джекпот</div>
      <div class="sj-val" id="sjVal">0 ₽</div>
      <div class="sj-hint">падает на любой победе ×2+</div>
    </div>
    <div class="side-online"><span class="dot"></span><b id="onlineVal">0</b>&nbsp;онлайн</div>
    <div class="side-foot">18+ • Играйте ответственно</div>
  </aside>

  <div id="main">
    <header id="top">
      <button class="logo m-logo" data-nav="home"><span class="logo-cow">🐮</span><span class="logo-text">Loot<b>UP</b><i class="logo-arrow">↗</i></span></button>
      <div class="top-right">
        <button id="soundBtn" class="icon-btn" title="Звук"></button>
        <button id="balChip" class="bal-chip" title="Кошелёк">
          <span class="rub-ic">₽</span><span id="balVal">0</span>
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
        </button>
        <button id="depBtn" class="btn gold dep-btn">Пополнить</button>
        <button id="avaBtn" class="ava-btn" title="Профиль"></button>
      </div>
    </header>

    <div id="livebar">
      <div class="live-label"><span class="dot"></span>Live</div>
      <div id="liveFeed"></div>
    </div>

    <main id="page"></main>

    <footer id="foot">
      <span>🐮 LootUP</span> — онлайн-казино. 18+ • Играйте ответственно.
    </footer>
  </div>
</div>

<nav id="tabbar"></nav>
<div id="modalRoot"></div>
<div id="gameRoot"></div>
<div id="toasts"></div>
<canvas id="confetti"></canvas>

<script src="js/art.js"></script>
<script src="js/core.js"></script>
<script src="js/games.js"></script>
<script src="js/games2.js"></script>
<script src="js/tg.js"></script>
</body>
</html>
